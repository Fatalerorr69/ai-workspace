[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "starcore"
version = "0.1.0"
description = "STARCORE Mobile Core CLI"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.7.0",
    "sqlite-utils>=3.30",
]

[project.scripts]
starcore = "core.cli.app:app"
