<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STARCORE Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0e17;
            color: #e0e6f0;
            padding: 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #00d4ff, #7b2ffc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 20px;
        }
        .status-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .card {
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
        }
        .card h3 {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #8899b0;
            margin-bottom: 10px;
        }
        .card .value {
            font-size: 2rem;
            font-weight: 700;
            color: #00d4ff;
        }
        .card .value.green { color: #4ade80; }
        .card .value.yellow { color: #fbbf24; }
        .card .value.red { color: #f87171; }
        .section {
            background: rgba(255,255,255,0.03);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .section h2 {
            font-size: 1.2rem;
            margin-bottom: 15px;
            color: #00d4ff;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 10px 12px;
            text-align: left;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        th {
            color: #8899b0;
            font-weight: 600;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        td { color: #e0e6f0; }
        .badge {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .badge.running { background: #4ade80; color: #0a0e17; }
        .badge.stopped { background: #f87171; color: #0a0e17; }
        .log-box {
            background: rgba(0,0,0,0.3);
            border-radius: 8px;
            padding: 15px;
            font-family: monospace;
            font-size: 0.8rem;
            max-height: 200px;
            overflow-y: auto;
            white-space: pre-wrap;
            color: #94a3b8;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .refresh-btn {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: #e0e6f0;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            margin-bottom: 20px;
        }
        .refresh-btn:hover { background: rgba(255,255,255,0.2); }
        @media (max-width: 600px) {
            .status-grid { grid-template-columns: 1fr 1fr; }
            h1 { font-size: 1.8rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 STARCORE Dashboard</h1>
        <button class="refresh-btn" onclick="loadData()">🔄 Refresh</button>
        <div class="status-grid" id="statusGrid">
            <div class="card"><h3>Služby</h3><div class="value" id="servicesTotal">-</div><div style="font-size:0.8rem;color:#8899b0;">běžících: <span id="servicesRunning">-</span></div></div>
            <div class="card"><h3>HIVE Engine</h3><div class="value" id="hiveStatus">-</div></div>
            <div class="card"><h3>Agenti</h3><div class="value" id="agentsTotal">-</div></div>
            <div class="card"><h3>Systém</h3><div class="value" id="systemInfo" style="font-size:1.2rem;">-</div></div>
        </div>
        <div class="section"><h2>📋 Služby</h2><div id="servicesTable"><p>Načítání...</p></div></div>
        <div class="section"><h2>🤖 HIVE Agenti</h2><div id="agentsTable"><p>Načítání...</p></div></div>
        <div class="section"><h2>📄 Logy</h2><div id="logsContainer"><p>Vyberte službu pro zobrazení logů:</p>
        <select id="logServiceSelect" onchange="loadLogs()" style="background:rgba(255,255,255,0.05);color:#e0e6f0;border:1px solid rgba(255,255,255,0.1);padding:8px;border-radius:6px;width:200px;"><option value="">-- vyberte --</option></select>
        <div class="log-box" id="logContent">Zde se zobrazí logy...</div></div></div>
    </div>
    <script>
        async function loadData() {
            try {
                const statusRes = await fetch('/api/status');
                const status = await statusRes.json();
                document.getElementById('servicesTotal').textContent = status.services.total;
                document.getElementById('servicesRunning').textContent = status.services.running;
                document.getElementById('hiveStatus').textContent = status.hive.running ? '🟢 Běží' : '🔴 Zastaven';
                document.getElementById('agentsTotal').textContent = status.hive.agents;
                document.getElementById('systemInfo').textContent = `${status.system.os} | ${status.system.python}`;
                const servicesRes = await fetch('/api/services');
                const services = await servicesRes.json();
                let servicesHtml = '<table><thead><tr><th>Název</th><th>Stav</th><th>Popis</th></tr></thead><tbody>';
                for (const [name, data] of Object.entries(services)) {
                    const statusClass = data.status === 'running' ? 'running' : 'stopped';
                    servicesHtml += `<tr><td><strong>${name}</strong></td><td><span class="badge ${statusClass}">${data.status}</span></td><td>${data.description || '-'}</td></tr>`;
                }
                servicesHtml += '</tbody></table>';
                document.getElementById('servicesTable').innerHTML = servicesHtml;
                const agentsRes = await fetch('/api/hive/agents');
                const agents = await agentsRes.json();
                let agentsHtml = '<table><thead><tr><th>Jméno</th><th>Config</th></tr></thead><tbody>';
                for (const [name, config] of Object.entries(agents)) {
                    agentsHtml += `<tr><td><strong>${name}</strong></td><td><code>${JSON.stringify(config)}</code></td></tr>`;
                }
                agentsHtml += '</tbody></table>';
                document.getElementById('agentsTable').innerHTML = agentsHtml || '<p>Žádní agenti</p>';
                const select = document.getElementById('logServiceSelect');
                const currentValue = select.value;
                select.innerHTML = '<option value="">-- vyberte --</option>';
                for (const name of Object.keys(services)) {
                    select.innerHTML += `<option value="${name}">${name}</option>`;
                }
                if (currentValue && Object.keys(services).includes(currentValue)) {
                    select.value = currentValue;
                    loadLogs();
                }
            } catch(e) { console.error('Chyba načítání:', e); }
        }
        async function loadLogs() {
            const select = document.getElementById('logServiceSelect');
            const service = select.value;
            const logContent = document.getElementById('logContent');
            if (!service) { logContent.textContent = 'Vyberte službu pro zobrazení logů.'; return; }
            try {
                const res = await fetch(`/api/services/${service}/logs?lines=20`);
                const data = await res.json();
                logContent.textContent = data.logs || 'Žádné logy';
            } catch(e) { logContent.textContent = 'Chyba načítání logů'; }
        }
        document.addEventListener('DOMContentLoaded', loadData);
        setInterval(loadData, 10000);
    </script>
</body>
</html>
